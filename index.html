<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="src/style.css"/>
       <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"rel="stylesheet">
       <title>Week 7 Project</title>
    </head>
    <body>
        <div class="weather-app">
            <header>
                <form class="search-form" id="search-form">
                    <input type="search" placeholder="Enter a City..." required id="search-form-input" class="search-form-input" />
                    <input type="search" value="Search" class="search-form-button" />
                </form>
            </header>
            <main>
                <div class="weather-app-data">
                    <div>
                        <h1 class="weather-app-city" id="city">Paris</h1>
                        <p class="weather-app-details">
                            <span id="time"></span> <span id="description">Cloudy</span>
                            <br />
                            Humidity: <strong id="humidity"></strong>, Wind: <strong id="wind-speed"></strong>
                        </p>
                    </div>
                    <div class="weather-app-temperature-container">
                        <div id="icon"> <img src="http://shecodes-assets.s3.amazonaws.com/api/weather/icons/clear-sky-night.png" class="weather-app-icon"/></div>
                        <div class="weather-app-temperature" id="temperature">12</div>
                        <div class="weather-app-unit">°C</div>
                    </div>
                </div>
            </main>
            <footer>
                Coded by <a href="https://www.shecodes.io/graduates/182572-khalea-mitchell" target="_blank">Khalea</a> and is on <a
                    href="https://github.com/KhaleaM/Plus-Week-7-Project" target="_blank">GitHub</a> and on <a
                    href="https://app.netlify.com/teams/khaleam/projects" target="_blank">Netlify</a>
            </footer>
        </div>
        <script src="src/index.js"></script>
    </body>
</html>
